<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPVN | Application Portal</title>
  <meta name="description" content="CPVN Internal Application Portal">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #182230;
    }

    header {
      padding: 32px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .container {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { color: #667085; margin: 0; }

    main { padding: 32px 0; }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .app {
      display: block;
      padding: 24px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, box-shadow .2s;
    }

    .app:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px #18223012;
    }

    .app h2 { font-size: 19px; margin: 0 0 10px; }
    .app p { color: #667085; line-height: 1.6; margin: 0 0 18px; }
    .open { color: #2563eb; font-weight: 600; }

    footer {
      padding: 24px 16px;
      text-align: center;
      color: #667085;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <h1>CPVN Application Portal</h1>
      <p class="subtitle">
        Central access to internal applications
      </p>
    </div>
  </header>

  <main class="container">
    <div class="apps">
      <a class="app" href="./mytask/">
        <h2>My Task</h2>
        <p>Task management and progress tracking.</p>
        <span class="open">Open Application →</span>
      </a>

      <a class="app" href="./hrhue/">
        <h2>HR Hue</h2>
        <p>Department task and work management.</p>
        <span class="open">Open Application →</span>
      </a>

      <a class="app" href="./stock-aqua/">
        <h2>Stock Aqua</h2>
        <p>Stock reporting and data analysis.</p>
        <span class="open">Open Application →</span>
      </a>
    </div>
  </main>

  <footer>
    CPVN Application Portal
  </footer>
</body>
</html>
